name: Build and Push Release Images to GHCR

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io/openinsight-proj
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract commit SHA (short)
        run: echo "COMMIT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/dashboard-discover:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/dashboard-discover:sha-${{ env.COMMIT_SHA }}
            ${{ env.REGISTRY }}/dashboard-discover:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max